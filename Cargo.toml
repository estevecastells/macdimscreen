[workspace]
resolver = "2"
members = ["crates/dim-core", "crates/dimd", "crates/dimctl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.87"
repository = "https://github.com/estevecastells/macdimscreen"
homepage = "https://github.com/estevecastells/macdimscreen"

[workspace.dependencies]
dim-core = { path = "crates/dim-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
libc = "0.2"
signal-hook = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Keep unwinding so the daemon's drop guard can restore Night Shift on panic.
panic = "unwind"
